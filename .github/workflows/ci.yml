name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: lint + type + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate daily-content pools
        run: npm run daily:validate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: tsc -b

      - name: Unit tests
        run: npm run test:unit

  e2e:
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Chromium-only on CI. The non-chromium projects (mobile-chromium,
        # mobile-webkit, desktop-firefox-touch) remain configured in
        # playwright.config.ts for local opt-in via `--project=<name>`, but
        # CI doesn't gate on them yet — they consistently fail under
        # ubuntu-latest (no real GPU, WebKit theme-bootstrap timing,
        # Firefox WebGL2). Roadmap item: self-hosted runner + green
        # cross-browser baseline before re-adding to the CI matrix.
        # See `docs/roadmap.md` § "Cross-browser CI failures from PR #36".
        project: [chromium]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests (${{ matrix.project }})
        run: npx playwright test --project=${{ matrix.project }} --reporter=blob
        env:
          VITE_ANALYTICS_ENDPOINT: ''
          VITE_CF_WA_TOKEN: ''

      - name: Upload blob report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-blob-${{ matrix.project }}
          path: blob-report
          retention-days: 1

  merge-reports:
    name: Merge e2e reports
    needs: [e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: playwright-blob-*
          merge-multiple: true

      - name: Merge into HTML report
        run: npx playwright merge-reports --reporter=html all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
