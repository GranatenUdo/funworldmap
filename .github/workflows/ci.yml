name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: lint + type + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate daily-content pools
        run: npm run daily:validate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: tsc -b

      - name: Bundle-size budget check
        run: npm run bundle:budget
        env:
          VITE_SENTRY_DSN: ''
          VITE_CF_WA_TOKEN: ''
          VITE_ANALYTICS_ENDPOINT: ''

      - name: Unit tests
        run: npm run test:unit

  e2e:
    name: e2e (${{ matrix.project }} shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Chromium-only on CI. The non-chromium projects (mobile-chromium,
        # mobile-webkit, desktop-firefox-touch) remain configured in
        # playwright.config.ts for local opt-in via `--project=<name>`, but
        # CI doesn't gate on them yet — they consistently fail under
        # ubuntu-latest (no real GPU, WebKit theme-bootstrap timing,
        # Firefox WebGL2). Roadmap item: self-hosted runner + green
        # cross-browser baseline before re-adding to the CI matrix.
        # See `docs/roadmap.md` § "Cross-browser CI failures from PR #36".
        project: [chromium]
        # 4-way sharding: split the ~215-spec chromium suite across 4 parallel
        # runners. Each shard runs ~50 specs in ~7 min wall-clock instead of
        # one runner doing all 215 in ~28 min. Reduces per-shard accumulated
        # cold-WebGL pressure; flaky timeouts have more headroom because the
        # shard finishes before the runner's per-job time pressure builds up.
        # Per Playwright docs (https://playwright.dev/docs/test-sharding),
        # fullyParallel=true (already set in playwright.config.ts) distributes
        # individual TESTS not files, so shards are balanced.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Install Mesa software OpenGL drivers (llvmpipe). On GitHub-hosted
      # ubuntu-latest there's no GPU, so without this Chromium falls back to
      # SwiftShader (its built-in software renderer), which is 5-10x slower
      # than llvmpipe for WebGL2 paths and was the documented cause of cold-
      # WebGL CI flakes on PR #36. Per Promaton/Snider 2026-02 research, just
      # having Mesa available gives ~3x speedup on WebGL-heavy tests even
      # without any GPU acceleration.
      - name: Install Mesa software OpenGL drivers
        run: sudo apt-get install -y mesa-utils libgl1-mesa-dri libglu1-mesa libegl1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests (${{ matrix.project }} shard ${{ matrix.shard }}/4)
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/4 --reporter=blob
        env:
          VITE_ANALYTICS_ENDPOINT: ''
          VITE_CF_WA_TOKEN: ''

      - name: Upload blob report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          # Unique per (project, shard) so they don't collide on download.
          name: playwright-blob-${{ matrix.project }}-${{ matrix.shard }}
          path: blob-report
          retention-days: 1

  merge-reports:
    name: Merge e2e reports
    needs: [e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `actions: read` is required by `gh run download` to list workflow-run
      # artifacts via the GitHub API. Without it the CLI errors with
      # `HTTP 403: Resource not accessible by integration`. actions/download-artifact@v4
      # itself works without this permission (uses a privileged internal path)
      # but its blob-storage download has hard-coded retries that exhausted on
      # PR #59; `gh run download` + outer bash retry is more robust.
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download blob reports (with retry)
        # actions/download-artifact@v4 has hard-coded internal retry behavior;
        # when one of 4 parallel artifact downloads times out on Azure blob
        # storage, the whole step fails (observed on PR #59 — 3 of 4 artifacts
        # downloaded fine, 1 timed out after 5 internal retries). Wrap with
        # an outer bash retry that uses `gh run download` (CLI tool with
        # different transport path; more reliable for cross-job artifact
        # retrieval).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p all-blob-reports
          for attempt in 1 2 3; do
            echo "Download attempt $attempt..."
            if gh run download ${{ github.run_id }} \
                --pattern 'playwright-blob-*' \
                --dir all-blob-reports; then
              echo "Download succeeded on attempt $attempt"
              # Flatten: each artifact extracts into its own subdir; merge them.
              find all-blob-reports -mindepth 2 -type f -exec mv -t all-blob-reports {} +
              find all-blob-reports -mindepth 1 -type d -empty -delete
              ls all-blob-reports
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Failed, sleeping 30s before retry..."
              sleep 30
            fi
          done
          echo "All 3 attempts failed"
          exit 1

      - name: Merge into HTML report
        run: npx playwright merge-reports --reporter=html all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
