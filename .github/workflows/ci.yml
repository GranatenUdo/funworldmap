name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: tsc -b

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
        env:
          # Explicit empty — track() becomes a no-op under e2e.
          # Playwright also sets window.__PLAYWRIGHT__ = true via the test helper,
          # which is a secondary no-op guard.
          VITE_ANALYTICS_ENDPOINT: ''
          VITE_CF_WA_TOKEN: ''

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
