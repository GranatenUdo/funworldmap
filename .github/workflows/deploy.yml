name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: [CI, CodeQL]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      eligible: ${{ steps.gate.outputs.eligible }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      # Gate code comes from trusted main, never a PR artifact or fork checkout.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        id: gate
        with:
          script: |
            const { checkRelease } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/release-gate.mjs`)
            await checkRelease({ github, context, core })

  build:
    needs: authorize
    if: needs.authorize.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Build verified revision
        run: npm run build
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_CF_WA_TOKEN: ${{ secrets.VITE_CF_WA_TOKEN }}
          VITE_ANALYTICS_ENDPOINT: ${{ secrets.VITE_ANALYTICS_ENDPOINT }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: [authorize, build]
    if: needs.authorize.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        id: current
        env:
          VERIFIED_SHA: ${{ needs.authorize.outputs.sha }}
        with:
          script: |
            const { data } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' })
            const current = data.object.sha === process.env.VERIFIED_SHA
            core.setOutput('current', String(current))
            if (!current) core.notice('Skipping superseded revision: main advanced during build.')
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        if: steps.current.outputs.current == 'true'
        id: deployment
