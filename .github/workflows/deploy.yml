name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['Daily puzzle index']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The daily index lives on the orphan `data` branch. Obtain it with a real
      # checkout — NOT `git fetch origin data` + `git show origin/data:...`:
      # actions/checkout configures a single-branch refspec, so a bare
      # `git fetch origin data` only updates FETCH_HEAD and never creates the
      # `origin/data` ref. `git show origin/data:...` would then fail and the
      # index would be silently regenerated every deploy instead of served from
      # `data`. `continue-on-error` lets a missing `data` branch fall through to
      # the generate fallback below. (Same pattern as daily-puzzle.yml.)
      - name: Check out daily index from data branch
        uses: actions/checkout@v6
        continue-on-error: true
        with:
          ref: data
          path: .daily-data

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Provide daily index (from data branch, else generate)
        run: |
          mkdir -p public/daily
          if [ -f .daily-data/index.json ]; then
            cp .daily-data/index.json public/daily/index.json
            echo "Using data-branch index."
          else
            echo "data branch unavailable — generating fresh."
            npm run daily:generate
          fi

      - name: Build
        run: npm run build
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_CF_WA_TOKEN: ${{ secrets.VITE_CF_WA_TOKEN }}
          VITE_ANALYTICS_ENDPOINT: ${{ secrets.VITE_ANALYTICS_ENDPOINT }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
